info:
  name: Delete Booking
  type: http
  seq: 10

http:
  method: delete
  url: "{{BaseURL}}/:path/:id?Cookie=token={{TokenID}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Cookie
      value: token={{TokenID}}
  params:
    - name: Cookie
      value: token={{TokenID}}
      type: query
    - name: path
      value: booking
      type: path
    - name: id
      value: "{{BookingID}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
      description: Request was successful.

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
